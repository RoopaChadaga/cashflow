<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SOV Billing Forecast Prototype</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px Arial,Helvetica,sans-serif;color:#1f2937;background:#f3f5f7}button,input,select{font:inherit}header{height:58px;background:#172033;color:white;display:flex;align-items:center;justify-content:space-between;padding:0 22px}h1{font-size:18px;margin:0}.tabs button,.actions button{border:1px solid #cbd5e1;background:white;border-radius:6px;padding:8px 10px;cursor:pointer}.tabs button.active{background:#1f6feb;color:white;border-color:#1f6feb}.wrap{padding:18px}.bar{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin:0 0 14px}.kpi,.panel{background:white;border:1px solid #d9dee5;border-radius:8px}.kpi{padding:10px}.kpi b{display:block;font-size:18px;margin-top:3px}.panel{padding:14px;margin-bottom:14px}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.warn{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;padding:10px;border-radius:7px;margin-bottom:12px}table{width:100%;border-collapse:collapse;background:white}th,td{border-bottom:1px solid #e5e7eb;padding:8px;text-align:left;vertical-align:top;white-space:nowrap}th{font-size:12px;color:#64748b;background:#f8fafc}.tip{position:relative;display:inline-block;border-bottom:1px dotted #64748b;cursor:help}.tip:after{content:attr(data-tip);display:none;position:absolute;top:22px;left:0;width:260px;white-space:normal;background:#172033;color:white;padding:9px 10px;border-radius:6px;box-shadow:0 8px 20px #0003;z-index:50;line-height:1.35}.tip:hover:after{display:block}.scroll{overflow:auto;border:1px solid #d9dee5;border-radius:8px}.forecast-scroll table{width:max-content;min-width:100%}.freeze{position:sticky;background:inherit;z-index:2}.f1{left:0;min-width:86px}.f2{left:86px;min-width:180px}.f3{left:266px;min-width:120px}.f4{left:386px;min-width:130px}.forecast-scroll th.freeze{z-index:4;background:#f8fafc}.float-x{position:fixed;left:18px;right:18px;bottom:10px;overflow-x:auto;overflow-y:hidden;height:18px;background:white;border:1px solid #cbd5e1;border-radius:6px;z-index:20}.float-x div{height:1px}.badge{padding:3px 7px;border-radius:999px;font-size:12px;background:#e2e8f0}.Ready,.Mapped{background:#dcfce7;color:#166534}.Review,.Duration{background:#fee2e2;color:#991b1b}.Multiple,.Manual{background:#dbeafe;color:#1d4ed8}.Unmapped,.Curve{background:#fef3c7;color:#92400e}.Excluded{background:#e5e7eb;color:#374151}.mini{display:flex;gap:2px;align-items:end;height:30px}.mini i{width:9px;background:#1f6feb;border-radius:2px}.cards{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:10px}.card{background:white;border:1px solid #d9dee5;border-radius:8px;padding:11px;cursor:pointer}.card.active{outline:3px solid #93c5fd}.muted{color:#64748b;font-size:12px}.detail{background:#f8fafc}input.money{width:92px;border:1px solid #cbd5e1;border-radius:5px;padding:5px}.locked{background:#eef2f7;color:#64748b;cursor:not-allowed}.manual{background:#ecfeff!important}.cell div{line-height:1.35}.cell .a{font-weight:700;color:#0f172a}.cell .f{color:#475569}.cell .v{color:#b45309}.filters{display:flex;gap:8px;margin-bottom:10px}.filters input,.filters select{border:1px solid #cbd5e1;border-radius:6px;padding:8px}.sticky{position:sticky;left:0;background:inherit;z-index:1}.hide{display:none}
</style>
</head>
<body>
<header><h1>Cashflow Management: SOV Schedule Mapping</h1><div class="tabs"><button class="active" data-tab="mapping">Mapping</button><button data-tab="forecast">Forecast Grid</button></div></header>
<div class="wrap">
<section id="mapping">
  <div class="bar" id="kpis"></div>
  <div class="actions"><button onclick="toast('Imported SOV + schedule sample data')">Import SOV + Schedule</button><button onclick="toast('Mapping version saved')">Save Mapping Version</button><button onclick="expandAll()">Expand All</button></div>
  <div class="scroll"><table id="mapTable"></table></div>
</section>
<section id="forecast" class="hide">
  <div class="warn">3 SOV lines need attention. Review mapping, duration, or curve warnings.</div>
  <div class="actions"><button onclick="toast('Forecast saved')">Save</button><button onclick="toast('Snapshot saved: Draft v2')">Save Snapshot</button><button onclick="genForecast();toast('Forecast recalculated')">Recalculate Forecast</button><button onclick="toast('CSV export simulated')">Export CSV</button><select id="view" onchange="genForecast()"><option>Gross billing</option><option>Retention held</option><option>Net billing</option><option>Cumulative billing</option></select></div>
  <div class="filters"><input id="q" placeholder="Search SOV lines" oninput="genForecast()"><select id="statusFilter" onchange="genForecast()"><option>All statuses</option><option>Ready</option><option>Needs Review</option><option>Duration Missing</option><option>Unmapped</option></select><label><input type="checkbox" id="warnOnly" onchange="genForecast()"> warnings only</label></div>
  <div class="scroll forecast-scroll" id="forecastWrap"><table id="forecastTable"></table></div>
  <div class="float-x hide" id="floatX"><div></div></div>
</section>
</div>
<script>
const months=['Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec','Jan','Feb','Mar'],locked=4,ret=.05;
let picked='Linear',expanded={},toastTimer;
const curves={'Linear':[1,1,1,1,1],'Front Loaded':[6,2,1,0.5,0.5],'Bell Curve':[1,2,4,2,1],'End Loaded':[0.5,0.5,1,2,6],'Milestone Based':[0,4,0,0,6],'Manual':[4,2,1.5,1.5,1]};
let rows=[
['01-100','Demo','DemoCo',420000,0,168000,'Demo',60,'Front Loaded','Ready',[['Demo',100,'04/01','05/30',60,0,'Front Loaded','Mapped']]],
['02-200','Sitework','CivilWorks',900000,35000,180000,'Sitework Areas 1-4',160,'Bell Curve','Multiple Drivers',[['Sitework A1-A2',50,'05/01','08/30',122,30,'Bell Curve','Mapped'],['Sitework A3-A4',50,'08/15','11/30',108,108,'End Loaded','Mapped']]],
['03-300','Slabs / Concrete','CoreConc',1250000,50000,250000,'Underground + Structural',140,'Bell Curve','Ready',[['Underground',35,'05/15','07/15',61,0,'Front Loaded','Mapped'],['Structural',65,'07/01','10/15',106,45,'Bell Curve','Mapped']]],
['04-400','Structural','SteelBuilt',2100000,0,420000,'Structural',120,'Bell Curve','Ready',[['Structural Frame',100,'06/10','10/10',122,60,'Bell Curve','Mapped']]],
['05-500','Roofing','TopSeal',620000,0,0,'Roof Buildout',45,'End Loaded','Duration Missing',[['Roof Buildout',100,'09/01','',0,45,'End Loaded','Duration Missing']]],
['06-600','Drywall','InteriorPro',780000,25000,0,'Vertical + Interiors',105,'Bell Curve','Needs Review',[['Vertical',40,'09/01','10/20',50,50,'Linear','Mapped'],['Interiors',50,'10/10','12/20',72,72,'Bell Curve','Mapped']]],
['07-700','ACT / Ceilings','CeilingsInc',310000,0,0,'Finishes',75,'End Loaded','Ready',[['Finishes',100,'11/01','01/15',75,75,'End Loaded','Mapped']]],
['08-800','Flooring','FloorOne',540000,0,0,'Finishes',65,'End Loaded','Ready',[['Floor Finishes',100,'12/01','02/05',66,66,'End Loaded','Mapped']]],
['09-900','Electrical / Fire Alarm','VoltFire',1600000,80000,160000,'Electrical UG + OH + Trim + Gear',220,'Bell Curve','Multiple Drivers',[['Electrical UG',15,'05/15','07/01',47,0,'Front Loaded','Mapped'],['Overhead Electrical',35,'08/01','11/15',106,106,'Bell Curve','Mapped'],['Electrical Trim',25,'12/01','02/15',76,76,'End Loaded','Mapped'],['Gear / Energization',25,'01/10','03/10',59,59,'Milestone Based','Mapped']]],
['10-1000','Plumbing / HVAC','MechFlow',1750000,60000,175000,'Underground + Overhead + BAS',210,'Bell Curve','Ready',[['Mechanical UG',25,'05/20','07/15',56,0,'Front Loaded','Mapped'],['Overhead MEP',55,'08/01','12/15',136,136,'Bell Curve','Mapped'],['BAS Startup',20,'01/01','03/01',59,59,'Milestone Based','Mapped']]],
['11-1100','Fire Protection','SprinklerSys',480000,0,0,'Overhead',95,'Linear','Ready',[['FP Rough-in',100,'08/15','11/18',95,95,'Linear','Mapped']]],
['12-1200','Communications / IDF','NetBuild',390000,15000,0,'Electrical / IDF',85,'End Loaded','Ready',[['IDF + Low Voltage',100,'10/01','12/25',85,85,'End Loaded','Mapped']]],
['13-1300','General Conditions','WHE',1300000,0,520000,'Construction LOE',365,'Linear','Ready',[['Construction LOE',100,'04/01','03/31',365,240,'Linear','Mapped']]],
['14-1400','OH / Profit','WHE',950000,0,190000,'Project Duration',365,'Linear','Ready',[['Project Duration',100,'04/01','03/31',365,240,'Linear','Mapped']]]
].map((r,i)=>({id:i,code:r[0],desc:r[1],trade:r[2],budget:r[3],co:r[4],actual:r[5],drivers:r[6],duration:r[7],curve:r[8],status:r[9],maps:r[10],over:{}}));
function money(n){return '$'+Math.round(n).toLocaleString()}
function badge(s){let c=s.split(' ')[0];return `<span class="badge ${c}">${s}</span>`}
function toast(t){clearTimeout(toastTimer);let x=document.getElementById('toast')||document.body.appendChild(Object.assign(document.createElement('div'),{id:'toast'}));x.style='position:fixed;right:18px;bottom:18px;background:#172033;color:white;padding:10px 14px;border-radius:7px';x.textContent=t;toastTimer=setTimeout(()=>x.remove(),1800)}
function kpis(){let total=rows.reduce((a,r)=>a+r.budget+r.co,0),bad=rows.filter(r=>/Review|Missing|Unmapped|Curve/.test(r.status));document.getElementById('kpis').innerHTML=[['Total SOV',money(total)],['Mapped Value','93%'],['Unmapped',money(620000)],['Needs Review',bad.length],['Drivers',rows.reduce((a,r)=>a+r.maps.length,0)],['Forecast Start','Apr 2026'],['Forecast Finish','Mar 2027']].map(x=>`<div class=kpi>${x[0]}<b>${x[1]}</b></div>`).join('')}
function weights(n,curve){let p=curves[curve]||curves.Linear,a=[];for(let i=0;i<n;i++)a.push(p[Math.floor(i*p.length/n)]);let s=a.reduce((x,y)=>x+y,0)||1;return a.map(x=>x/s)}
function curveSel(r,show=1){let w=weights(months.length-locked,r.curve).map(x=>Math.round(x*100));return `<select onchange="rBy(${r.id}).curve=this.value;rBy(${r.id}).over={};render()">${Object.keys(curves).map(c=>`<option ${c==r.curve?'selected':''}>${c}</option>`)}</select>${show?`<div class=muted>future weights: ${w.join('/')}%</div>`:''}`}
function mapTable(){document.getElementById('mapTable').innerHTML='<tr><th></th><th>SOV #</th><th>Description</th><th>Budget</th><th>Suggested Driver(s)</th><th>Start</th><th>Finish</th><th>Duration</th><th>Curve</th><th>Weight</th><th>Status</th><th>Actions</th></tr>'+rows.map(r=>`<tr><td><button onclick="expanded[${r.id}]=!expanded[${r.id}];render()">▸</button></td><td>${r.code}</td><td>${r.desc}</td><td>${money(r.budget+r.co)}</td><td>${r.drivers}</td><td>${r.maps[0][2]}</td><td>${r.maps.at(-1)[3]||'Missing'}</td><td>${r.duration}d</td><td>${curveSel(r)}</td><td>${r.maps.reduce((a,m)=>a+m[1],0)}%</td><td>${badge(r.status)}</td><td><button onclick="addDriver(${r.id})">Add</button> <button onclick="exclude(${r.id})">Exclude</button> <button onclick="reset(${r.id})">Reset</button></td></tr>${expanded[r.id]?detail(r):''}`).join('')}
function detail(r){return `<tr class=detail><td></td><td colspan=11><table><tr><th>Driver</th><th>Activities</th><th>Start</th><th>Finish</th><th>Duration</th><th>Remaining</th><th>Weight</th><th>Curve</th><th>Status</th><th></th></tr>${r.maps.map((m,i)=>`<tr><td>${m[0]}</td><td>${Math.max(1,i+2)}</td><td>${m[2]}</td><td>${m[3]||'Missing'}</td><td>${m[4]||'--'}</td><td>${m[5]}</td><td><input class=money value="${m[1]}" onchange="mSet(${r.id},${i},this.value)">%</td><td>${m[6]}</td><td>${badge(m[7])}</td><td><button onclick="remDriver(${r.id},${i})">Remove</button></td></tr>`).join('')}</table></td></tr>`}
function h(label,tip){return `<span class="tip" data-tip="${tip}">${label} ?</span>`}
function spread(amount,n,curve){return weights(n,curve).map(w=>amount*w)}
function forecast(){let q=document.getElementById('q')?.value.toLowerCase()||'',sf=document.getElementById('statusFilter')?.value||'All statuses',wo=document.getElementById('warnOnly')?.checked,view=document.getElementById('view')?.value||'Gross billing';let rs=rows.filter(r=>(r.code+r.desc).toLowerCase().includes(q)&&(sf=='All statuses'||r.status==sf)&&(!wo||!/Ready|Multiple Drivers/.test(r.status)));document.getElementById('forecastTable').innerHTML='<tr><th class="freeze f1">'+h('SOV #','CMiC Schedule of Values code')+'</th><th class="freeze f2">'+h('Description','CMiC SOV line description')+'</th><th class="freeze f3">'+h('Trade','Trade or contractor assigned to the SOV line')+'</th><th class="freeze f4">'+h('Revised Budget','Revised Budget = Original SOV Budget + Approved Change Orders')+'</th><th>'+h('Actual','Actual Billed to Date = sum of locked closed-period billings')+'</th><th>'+h('Actual Var','Actual Variance to Date = Actual billings through locked months - original forecast for locked months')+'</th><th>'+h('Retention','Retention Held = Forecast at Completion x 5% retention rate')+'</th><th>'+h('Remaining','Remaining to Bill = Revised Budget - Actual Billed to Date')+'</th><th>'+h('FAC','Forecast at Completion = Actual billings to date + forecasted future billings')+'</th><th>'+h('Budget Var','Budget Variance = Revised Budget - Forecast at Completion')+'</th><th>'+h('Curve','Distribution curve used to spread remaining billing across forecast months')+'</th><th>'+h('Drivers','Schedule driver groups used to determine timing')+'</th><th>'+h('Status','Mapping validation status based on duration, curve, and driver weight rules')+'</th>'+months.map((m,i)=>`<th>${h(m+(i<locked?' 🔒':''),i<locked?'Locked actual month from CMiC. Not editable. Shows actual, original forecast, and actual minus forecast variance.':'Editable forecast month. Gross = remaining to bill spread across unlocked months unless manually overridden. Retention = gross x 5%. Net = gross - retention.')}</th>`).join('')+'</tr>'+rs.map(r=>rowForecast(r,view)).join('');syncX()}
function rowForecast(r,view){let rev=r.budget+r.co,rem=rev-r.actual;if(!r.lockedBase)r.lockedBase=spread(rev,months.length,r.curve).slice(0,locked);let future=spread(rem,months.length-locked,r.curve),forecast=months.map((_,i)=>i<locked?r.lockedBase[i]:future[i-locked]),actual=months.map((_,i)=>i<locked?r.actual/locked:0);Object.keys(r.over).forEach(i=>forecast[i]=+r.over[i]);let vals=months.map((_,i)=>i<locked?actual[i]:forecast[i]),fac=vals.reduce((a,b)=>a+b,0),actualVar=actual.reduce((a,b)=>a+b,0)-r.lockedBase.reduce((a,b)=>a+b,0),cells=vals.map((v,i)=>{let x=view.includes('Retention')?v*ret:view.includes('Net')?v*(1-ret):view.includes('Cumulative')?vals.slice(0,i+1).reduce((a,b)=>a+b,0):v;if(i<locked){let f=r.lockedBase[i],a=actual[i],vv=a-f;return `<td class="locked cell" title="Locked month: compare CMiC actual billing against original forecast"><div class=a>A ${money(a)}</div><div class=f>F ${money(f)}</div><div class=v>Var ${money(vv)}</div></td>`}return `<td class="${r.over[i]?'manual':''}" onclick="editCell(${r.id},${i})" title="Click to override. Later months rebalance automatically.">${money(x)}</td>`}).join('');return `<tr><td class="freeze f1">${r.code}</td><td class="freeze f2">${r.desc}</td><td class="freeze f3">${r.trade}</td><td class="freeze f4">${money(rev)}</td><td>${money(r.actual)}</td><td>${money(actualVar)}</td><td>${money(fac*ret)}</td><td>${money(rem)}</td><td>${money(fac)}</td><td>${money(rev-fac)}</td><td>${curveSel(r,0)}</td><td>${r.drivers}</td><td>${badge(r.status)}</td>${cells}</tr>`}
function rBy(id){return rows.find(r=>r.id==id)}function render(){kpis();mapTable();forecast()}
function syncX(){let w=document.getElementById('forecastWrap'),x=document.getElementById('floatX'),t=document.getElementById('forecastTable');if(!w||!x||!t)return;x.classList.toggle('hide',document.getElementById('forecast').classList.contains('hide'));x.firstElementChild.style.width=t.scrollWidth+'px';x.onscroll=()=>w.scrollLeft=x.scrollLeft;w.onscroll=()=>x.scrollLeft=w.scrollLeft}
function expandAll(){rows.forEach(r=>expanded[r.id]=1);render()}function addDriver(id){let r=rBy(id);r.maps.push(['New Schedule Driver',0,'10/01','11/01',31,31,r.curve,'Needs Review']);r.status='Needs Review';expanded[id]=1;render()}function remDriver(id,i){rBy(id).maps.splice(i,1);render()}function mSet(id,i,v){let r=rBy(id);r.maps[i][1]=+v;r.status=r.maps.reduce((a,m)=>a+m[1],0)==100?'Ready':'Needs Review';render()}function exclude(id){rBy(id).status='Excluded';render()}function reset(id){let r=rBy(id);r.status='Ready';r.curve='Linear';r.over={};render()}function genForecast(){forecast()}function editCell(id,i){if(i<locked)return toast('Cell is locked. Only future forecast periods can be edited.');let r=rBy(id),v=prompt('Manual forecast value');if(!v)return;let rem=r.budget+r.co-r.actual,val=+v.replace(/[$,]/g,'');if(isNaN(val))return toast('Enter a number');let base=spread(rem,months.length-locked,r.curve);for(let j=locked;j<months.length;j++)if(r.over[j]==null)r.over[j]=base[j-locked];r.over[i]=val;let used=0;for(let j=locked;j<=i;j++)used+=+r.over[j];let rest=Math.max(0,rem-used),w=weights(months.length-i-1,r.curve);for(let j=i+1;j<months.length;j++)r.over[j]=rest*w[j-i-1];forecast();toast('Manual override saved; remaining months rebalanced')}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');['mapping','forecast'].forEach(id=>document.getElementById(id).classList.toggle('hide',id!=b.dataset.tab));render();syncX()});
render();
</script>
</body>
</html>
